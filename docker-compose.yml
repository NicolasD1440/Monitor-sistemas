services:

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: backend

    ports:
      - "5001:5001"

    volumes:
      - ./Backend:/app

    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

    container_name: frontend

    ports:
      - "5174:5173"

    volumes:
      - ./Frontend:/app
      - /app/node_modules

    restart: unless-stopped

    depends_on:
      - backend