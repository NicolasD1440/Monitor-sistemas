services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "5001:5001"
    extra_hosts:
      - "host.docker.internal:172.21.0.1"
    volumes:
      - ./Backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: "no"
    depends_on:
      - backend